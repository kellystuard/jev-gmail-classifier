# A valid config for the build tests. Synthetic: no real mail or addresses.
defaultThreshold: 0.8
triggerIntervalMinutes: 10
jevModel: jev-latest
dailyTokenBudget: 20000000
excludeQuery: from:bank.example OR label:Private
plainTextMethod: basic

rules:
  - id: fixture-approval
    question: Does this email ask the recipient to approve something?
    label: Approval Required
  - id: fixture-bill
    question: Is this email a bill or invoice?
    label: Finance/Bill
    threshold: 0.9
  - id: fixture-newsletter
    question: Is this email a newsletter the recipient subscribed to?
    action: move
    destination: label:Newsletters
    threshold: 0.95
