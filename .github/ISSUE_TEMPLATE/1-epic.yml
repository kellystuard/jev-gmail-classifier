name: Epic
description: A PDD §14 epic (E1–E10). Its stories are linked as sub-issues.
title: "E<n>: <epic name>"
labels: ["type: epic"]
body:
  - type: markdown
    attributes:
      value: |
        Epics come from [PDD §14](https://github.com/kellystuard/jev-gmail-classifier/blob/main/output/product-design-document.md#14-epics). Link each story to this issue as a **sub-issue**.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The epic's goal, as in PDD §14.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Architectural scope and details to settle
      description: From Solution Design §13. Settled details update that section or add an ADR.
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Other epics, as issue links.
      placeholder: "None"
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to the PDD, Solution Design, and ADR sections this epic builds on.
