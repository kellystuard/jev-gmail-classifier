name: Bug
description: Something doesn't behave as the design documents say.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include log events (never message bodies or the API key).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Link the design document section, if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
