# Keeps a release PR open that updates CHANGELOG.md and the package.json version
# from the squashed Conventional Commit titles on main, and tags vX.Y.Z when it
# merges (ES §10, ADR-0015). It runs with the default GITHUB_TOKEN, so the
# release PR's CI run waits for approval (status action_required). Before
# merging a release PR, approve that run and wait for the ci check to pass:
#   gh run list --workflow=ci.yml --branch release-please--branches--main--components--jev-gmail-classifier --status action_required
#   gh api -X POST repos/kellystuard/jev-gmail-classifier/actions/runs/<run-id>/approve
# Config: release-please-config.json and .release-please-manifest.json.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
